services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: instablog
      POSTGRES_USER: instablog
      POSTGRES_PASSWORD: instablog
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instablog"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - instablog-postgres:/var/lib/postgresql/data

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  instablog-postgres:
